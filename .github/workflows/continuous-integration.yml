name: Continuous integration
on:
  merge_group:
  pull_request:
  push:
    branches:
      - master
# Cancel in-progress runs for pull requests, but not for master branch pushes or merge queue
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    name: "Build and test on ${{ matrix.os }}"
    strategy:
      matrix:
        include:
          - os: macos-latest
          - os: windows-latest
          - os: ubuntu-latest
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out NullAway sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 'Set up JDK 28 EA from jdk.java.net'
        uses: oracle-actions/setup-java@fff43251af9936a0e6a4d5d0946e14f1680e9b6b # v1.5.0
        with:
          website: jdk.java.net
          release: 28
      - name: 'Set up JDKs'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: |
            17
            21
            25
          distribution: 'temurin'
          check-latest: 'true'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: List toolchains
        run: ./gradlew javaToolchains
      - name: Check formatting
        run: ./gradlew spotlessCheck
      - name: Check compilation
        run: ./gradlew assemble compileTestJava
      - name: Build and test
        # The preceding Spotless and compilation tasks are up to date, while build still guarantees
        # that every lifecycle and custom verification task runs.
        run: ./gradlew build
        env:
          # The Linux build produces the execution data consumed by the Codecov aggregation step.
          # Keep ordinary macOS and Windows test runs free of JaCoCo instrumentation overhead.
          ORG_GRADLE_PROJECT_enableJacoco: ${{ matrix.os == 'ubuntu-latest' && 'true' || 'false' }}
      - name: Run shellcheck
        run: ./gradlew shellcheck
        if: runner.os == 'Linux'
      - name: Aggregate jacoco coverage
        id: jacoco_report
        run: ./gradlew codeCoverageReport
        env:
          # Use the same test-task configuration as the preceding Linux build so its JaCoCo
          # execution data remains up-to-date and is included in the aggregate XML report.
          ORG_GRADLE_PROJECT_enableJacoco: 'true'
        continue-on-error: true
        if: runner.os == 'Linux' && github.repository == 'uber/NullAway'
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./code-coverage-report/build/reports/jacoco/codeCoverageReport/codeCoverageReport.xml
          token: ${{ secrets.CODECOV_TOKEN }}
        if: steps.jacoco_report.outcome == 'success'
      - name: Cleanup Codecov temporary files
        run: |
          # See https://github.com/codecov/codecov-action/issues/1851
          rm -rf codecov codecov.SHA256SUM codecov.SHA256SUM.sig
        if: steps.jacoco_report.outcome == 'success'
      - name: Test publishToMavenLocal flow
        env:
          ORG_GRADLE_PROJECT_VERSION_NAME: '0.0.0.1-LOCAL'
          ORG_GRADLE_PROJECT_RELEASE_SIGNING_ENABLED: 'false'
        run: ./gradlew publishToMavenLocal
      - name: Check that Git tree is clean after build and test
        run: ./.buildscript/check_git_clean.sh
  suppression-remover-regression-tests:
    name: "Suppression remover regression tests"
    runs-on: ubuntu-latest
    steps:
      - name: Check out NullAway sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.15'
          cache: 'pip'
          cache-dependency-path: scripts/nullaway-suppression-remover/pyproject.toml
      - name: Install suppression remover test dependencies
        working-directory: scripts/nullaway-suppression-remover
        run: python -m pip install --editable '.[test]'
      - name: Run suppression remover regression tests
        working-directory: scripts/nullaway-suppression-remover
        run: python -m pytest
  build-logic-tests:
    name: "Build logic tests"
    runs-on: ubuntu-latest
    steps:
      - name: Check out NullAway sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 'Set up JDKs'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25'
          distribution: 'temurin'
          check-latest: 'true'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      # Gradle builds buildSrc as an included build and asks it only for its plugins, so its own
      # tests run only when something asks for them.
      - name: Run buildSrc tests
        run: ./gradlew -p buildSrc test
  test-with-error-prone-snapshot:
    name: "Test with Error Prone snapshot"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 'Set up Default JDK'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: 25
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Test with Error Prone snapshot
        run: ./gradlew testErrorProneLatestSnapshot
  compile-other-projects:
    name: "Build ${{ matrix.project }} with snapshot"
    strategy:
      fail-fast: false
      # Each project builds at a pinned commit, so a change upstream cannot fail an unrelated
      # NullAway PR. Renovate moves sha to the tip of branch; .github/third-party/README.md explains
      # how to patch a project whose fix upstream has not merged yet.
      matrix:
        include:
          - project: caffeine
            url: https://github.com/ben-manes/caffeine.git
            branch: master
            sha: b9e876532a618690936c933f593911d0e3a9ce63
          - project: spring-framework
            url: https://github.com/spring-projects/spring-framework.git
            branch: main
            sha: 0c575d443dbdff69349a2369f40491c002dc2c96
          - project: junit-framework
            url: https://github.com/junit-team/junit-framework.git
            branch: main
            sha: 21b4a5fac91d0c4e684cedba0c0ce1ceb8809315
          - project: spring-boot
            url: https://github.com/spring-projects/spring-boot.git
            branch: main
            sha: 0d10cba89be586300791948e5608807882edb278
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 'Set up JDKs'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: | # JDK 26 needed for Caffeine
            26
            25
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Publish to Maven Local
        env:
          ORG_GRADLE_PROJECT_RELEASE_SIGNING_ENABLED: 'false'
        run: ./gradlew publishToMavenLocal
      - name: Check out ${{ matrix.project }} at the pinned commit
        env:
          PROJECT: ${{ matrix.project }}
          URL: ${{ matrix.url }}
          SHA: ${{ matrix.sha }}
        run: |
          git init "/tmp/$PROJECT"
          git -C "/tmp/$PROJECT" fetch --depth 1 "$URL" "$SHA"
          git -C "/tmp/$PROJECT" checkout --detach FETCH_HEAD
      - name: Apply patches to ${{ matrix.project }}
        env:
          PROJECT: ${{ matrix.project }}
        run: .github/third-party/apply-patches.sh ".github/third-party/$PROJECT" "/tmp/$PROJECT"
      - name: Run ${{ matrix.project }} build
        env:
          PROJECT: ${{ matrix.project }}
        run: |
          cp .github/workflows/use-snapshot.gradle.kts "/tmp/$PROJECT"
          cd "/tmp/$PROJECT"
          if [[ "$PROJECT" == "caffeine" ]]; then
            export JAVA_VERSION=26
          fi
          ./gradlew --init-script use-snapshot.gradle.kts assemble
  publish-snapshot:
    name: Publish snapshot to Maven Central
    needs:
      - build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && github.repository == 'uber/NullAway'
    runs-on: ubuntu-latest
    steps:
      - name: Check out NullAway sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: 25
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Verify snapshot version
        run: grep -Eq '^VERSION_NAME=.*-SNAPSHOT$' gradle.properties
      - name: Publish snapshot
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USER_TOKEN_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_USER_TOKEN_PASSWORD }}
          ORG_GRADLE_PROJECT_RELEASE_SIGNING_ENABLED: 'false'
        run: ./gradlew publishToMavenCentral
