name: Label pull requests by size

# pull_request_target is required to label pull requests from forks. This workflow only runs a
# pinned action from the trusted base branch and never checks out or executes pull request code.
on: # zizmor: ignore[dangerous-triggers] Required for fork PR labels; no PR code runs.
  pull_request_target:
    types: [opened, reopened, synchronize]
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  label-size:
    name: Label PR by size
    if: github.repository == 'uber/NullAway'
    runs-on: ubuntu-latest
    permissions:
      issues: write # Required to create missing repository labels.
      pull-requests: write # Required to read and update pull request labels.
    steps:
      - name: Apply size label
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const sizeLabels = new Map([
              ['size: small', {color: '0e8a16', description: 'Pull request changes at most 100 lines'}],
              ['size: medium', {color: 'fbca04', description: 'Pull request changes between 101 and 500 lines'}],
              ['size: large', {color: 'd93f0b', description: 'Pull request changes more than 500 lines'}],
            ]);

            // Fetch current data rather than relying on a potentially stale event payload.
            const {data: pr} = await github.rest.pulls.get({
              ...context.repo,
              pull_number: context.payload.pull_request.number,
            });
            const changes = pr.additions + pr.deletions;
            const wanted = changes <= 100
              ? 'size: small'
              : changes <= 500
                ? 'size: medium'
                : 'size: large';

            const repositoryLabels = await github.paginate(
              github.rest.issues.listLabelsForRepo,
              {...context.repo, per_page: 100},
            );
            const existingLabelNames = new Set(repositoryLabels.map((label) => label.name));
            for (const [name, definition] of sizeLabels) {
              if (existingLabelNames.has(name)) continue;
              try {
                await github.rest.issues.createLabel({...context.repo, name, ...definition});
                core.info(`Created missing repository label: ${name}`);
              } catch (error) {
                // Another workflow run may have created the label after the list request. Verify
                // that race rather than hiding an unrelated validation error.
                if (error.status !== 422) throw error;
                try {
                  await github.rest.issues.getLabel({...context.repo, name});
                  core.info(`Repository label was created concurrently: ${name}`);
                } catch {
                  throw error;
                }
              }
            }

            const present = new Set(pr.labels.map((label) => label.name));
            for (const label of sizeLabels.keys()) {
              if (label !== wanted && present.has(label)) {
                await github.rest.issues.removeLabel({
                  ...context.repo,
                  issue_number: pr.number,
                  name: label,
                });
              }
            }
            if (!present.has(wanted)) {
              await github.rest.issues.addLabels({
                ...context.repo,
                issue_number: pr.number,
                labels: [wanted],
              });
            }
            core.info(`Applied ${wanted} for ${changes} changed lines.`);
