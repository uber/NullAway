// Mostly taken from official Gradle sample: https://docs.gradle.org/current/samples/sample_jvm_multi_project_with_code_coverage.html
plugins {
    id 'jacoco'
}

// we pull in the snapshot version of Jacoco to support running on JDK 27 early access builds
// This repositories declaration is scoped so we can only pull in a snapshot version of Jacoco
// from the snapshots repo, not any other dependency
repositories {
    maven {
        name = "SonatypeSnapshots"
        url = uri("https://central.sonatype.com/repository/maven-snapshots/")
        mavenContent {
            snapshotsOnly()
        }
        content {
            includeGroup("org.jacoco")
        }
    }
}

jacoco {
    toolVersion = "0.8.16-SNAPSHOT"
}

// -PenableJacoco decides instrumentation for every Test task.  Left unset, only the `test` task is
// instrumented on a developer machine: it costs about 20% of that task's wall time, which buys the
// per-module XML report the diffCoverage task reads.  The testJdk* tasks re-run the same suite under
// other JDKs, so instrumenting them locally would multiply that cost over lines the `test` task
// already reaches.  The aggregate report collects the JDK-specific execution data through
// coverageDataElementsForTest below.
def enableJacoco = providers.gradleProperty("enableJacoco").map {
    it.toBoolean()
}

// -PdiffCoverageEnabled=false takes back everything the default turns on: the report, the XML it
// reads, and the instrumentation that exists only to produce them, so that one flag buys back the
// 20% for a run that is not about coverage.  -PenableJacoco still decides instrumentation wherever
// it is set, since the aggregate report needs the execution data whether or not diffCoverage runs.
// On CI, where the CI environment variable is true, the default is false: a CI job collects coverage
// only when it sets -PenableJacoco=true, and every other job runs its tests uninstrumented.
def runningOnCi = providers.environmentVariable("CI").map {
    it.toBoolean()
}.orElse(false)
def diffCoverageEnabled = providers.gradleProperty("diffCoverageEnabled")
        .map { it.isEmpty() || Boolean.parseBoolean(it) }
        .orElse(runningOnCi.map { !it })

tasks.withType(Test).configureEach { testTask ->
    def instrumented = enableJacoco
    .orElse(diffCoverageEnabled.get() && testTask.name == "test")
    .get()
    testTask.extensions.configure(JacocoTaskExtension) { jacocoExtension ->
        jacocoExtension.enabled = instrumented
    }
}

// The aggregate report in :code-coverage-report covers the whole build.  This per-module XML covers
// the `test` task alone, which is what a single-module run produces and all diffCoverage needs.
tasks.named("jacocoTestReport") {
    enabled = enableJacoco.orElse(diffCoverageEnabled).get()
    reports {
        xml.required = true
        html.required = false
    }
}

// Running the report as part of the test run keeps the XML in step with the execution data, so
// diffCoverage cannot read line numbers left over from an earlier run.
tasks.named("test") {
    finalizedBy(tasks.named("jacocoTestReport"))
}

// Every module asks git the same questions about the same repository, so one service answers them
// once for the whole build.  The name is what the task's @ServiceReference binds to.
gradle.sharedServices.registerIfAbsent(com.uber.nullaway.gradle.DiffCoverageTask.GIT_SERVICE, com.uber.nullaway.gradle.GitService) {
    parameters.repositoryRoot = rootProject.layout.projectDirectory
}

// -PdiffBase=<ref> names the base for every report about this branch's changes: diff coverage and
// diff mutation testing count the same lines as changed.
def diffBase = providers.gradleProperty("diffBase")

// The main source roots relative to the repository root, the form git diff prints paths in.
def mainSourceRoots = providers.provider {
    sourceSets.main.java.srcDirs.collect {
        rootDir.toPath().relativize(it.toPath()).toString()
    }
}

def diffCoverage = tasks.register("diffCoverage", com.uber.nullaway.gradle.DiffCoverageTask) {
    description = "Reports which of the lines this branch changed the last test run executed"
    group = LifecycleBasePlugin.VERIFICATION_GROUP
    reportFiles.from(tasks.named("jacocoTestReport").map {
        it.reports.xml.outputLocation
    })
    sourceRoots.set(mainSourceRoots)
    // A filtered run leaves the rest of the change looking unexecuted, so the scope is printed
    // beside the counts rather than left for the reader to remember.
    def testFilterPatterns = providers.provider {
        def testTask = tasks.getByName("test")
        def patterns = testTask.filter.includePatterns as List
        if (testTask.filter.metaClass.respondsTo(testTask.filter, "getCommandLineIncludePatterns")) {
            patterns += testTask.filter.commandLineIncludePatterns as List
        }
        patterns
    }
    scopeDescription = testFilterPatterns.map { patterns ->
        patterns.isEmpty() ? "${project.path}:test" : "${project.path}:test --tests ${patterns.join(' --tests ')}"
    }
    filtered = testFilterPatterns.map { !it.isEmpty() }
    // The console block is a summary of the work left; the file below holds the report whole.
    maxFiles = providers.gradleProperty("diffCoverageMaxFiles").map {
        Integer.parseInt(it)
    }.orElse(10)
    maxLinesPerFile = providers.gradleProperty("diffCoverageMaxLinesPerFile").map {
        Integer.parseInt(it)
    }.orElse(10)
    maxLinesTotal = providers.gradleProperty("diffCoverageMaxLines").map {
        Integer.parseInt(it)
    }.orElse(50)
    // -PdiffCoverageShowAll with no value reads as true, since nobody passing it means false.
    showAll = providers.gradleProperty("diffCoverageShowAll")
            .map { it.isEmpty() || Boolean.parseBoolean(it) }
            .orElse(false)
    outputFile = layout.buildDirectory.file("reports/diff-coverage/test.txt")
    baseRef = diffBase
}

def changedLines = tasks.register("changedLines", com.uber.nullaway.gradle.ChangedLinesTask) {
    description = "Writes the lines this branch changed in the main sources, for pitestDiff"
    sourceRoots.set(mainSourceRoots)
    baseRef = diffBase
    outputFile = layout.buildDirectory.file("diff/changed-lines.txt")
}

// Mutation testing of the lines this branch changed.  PIT runs the module's tests against copies of
// the main classes with one instruction changed, and a mutant that no test notices marks a changed
// line whose behavior no test asserts.  The interceptor from buildSrc drops every mutant outside the
// changed lines before PIT assigns tests to it, so the cost is one coverage pass over the tests plus
// a partial pass per mutant on a changed line.  It runs only on request.
configurations {
    pitest {
        canBeConsumed = false
        canBeResolved = true
    }
}

dependencies {
    pitest versionCatalogs.named("libs").findLibrary("pitest-command-line").get()
}

tasks.register("pitestDiff", JavaExec) {
    description = "Runs PIT mutation testing over the lines this branch changed"
    group = LifecycleBasePlugin.VERIFICATION_GROUP

    def testTask = tasks.named("test", Test)
    def changedLinesFile = changedLines.flatMap { it.outputFile }
    // The classpath becomes a --classPath argument at execution time, which carries no task
    // dependency of its own; declaring it as an input builds the classes and jars it names.
    inputs.files(sourceSets.test.runtimeClasspath)
    inputs.file(changedLinesFile)
    outputs.upToDateWhen { false }

    // PIT runs the tests on the JVM the `test` task runs them on.
    javaLauncher = testTask.flatMap { it.javaLauncher }
    mainClass = "org.pitest.mutationtest.commandline.MutationCoverageReport"
    // The jar of buildSrc carries the changed-lines interceptor and registers it with PIT.
    classpath = configurations.pitest + files(
            com.uber.nullaway.gradle.ChangedLinesFile.protectionDomain.codeSource.location)

    def reportDir = layout.buildDirectory.dir("reports/pitest-diff")
    def testRuntimeClasspath = sourceSets.test.runtimeClasspath
    def mainClassesDirs = sourceSets.main.output.classesDirs
    def mainSourceDirs = sourceSets.main.java.srcDirs
    def targetTests = providers.gradleProperty("pitestTargetTests").orElse("*")
    def mutators = providers.gradleProperty("pitestMutators").orElse("DEFAULTS")
    def threads = providers.gradleProperty("pitestThreads")
            .orElse(String.valueOf(Math.max(1, Runtime.runtime.availableProcessors().intdiv(2))))

    onlyIf("the branch changed lines of a class in the main sources of this module") {
        !com.uber.nullaway.gradle.ChangedLinesFile.targetClasses(
        com.uber.nullaway.gradle.ChangedLinesFile.read(changedLinesFile.get().asFile.toPath())).isEmpty()
    }

    doFirst {
        def changed = com.uber.nullaway.gradle.ChangedLinesFile.read(changedLinesFile.get().asFile.toPath())
        def targetClasses = com.uber.nullaway.gradle.ChangedLinesFile.targetClasses(changed)
        def test = testTask.get()
        def minionJvmArgs = test.jvmArgs + (test.maxHeapSize ? ["-Xmx" + test.maxHeapSize] : [])
        systemProperty(com.uber.nullaway.gradle.ChangedLinesFile.PITEST_PROPERTY,
                changedLinesFile.get().asFile.absolutePath)
        def options = [
            reportDir: reportDir.get().asFile.absolutePath,
            targetClasses: targetClasses.join(","),
            targetTests: targetTests.get(),
            // Only the main output is mutated, so a glob cannot reach a test class of the same name.
            mutableCodePaths: mainClassesDirs.files*.absolutePath.join(","),
            sourceDirs: mainSourceDirs*.absolutePath.join(","),
            classPath: testRuntimeClasspath.files*.absolutePath.join(","),
            jvmArgs: minionJvmArgs.join(","),
            mutators: mutators.get(),
            // PIT's own default list, plus the invariant checks: removing a Verify or Preconditions
            // call changes no diagnostic, so every such mutant would survive a passing suite.  PIT
            // drops every mutant on a line that makes such a call, not only the call's own.
            avoidCallsTo: [
                "java.util.logging",
                "org.apache.log4j",
                "org.apache.logging.log4j",
                "org.slf4j",
                "org.apache.commons.logging",
                "org.jboss.logging",
                "com.google.common.base.Verify",
                "com.google.common.base.Preconditions",
            ].join(","),
            threads: threads.get(),
            outputFormats: "XML,HTML",
            timestampedReports: "false",
            // A changed line can be a comment or a declaration with no instruction to mutate.
            failWhenNoMutations: "false",
            // A test case here compiles a Java source file, so PIT's default 4-second constant is too tight.
            timeoutConst: "20000",
            // linecoverage.xml names the tests that reach each block, which the report prints.
            exportLineCoverage: "true",
            // PIT runs every test, including those the `test` task's filter excludes, and refuses to
            // start when one fails before any mutation.  A test failing there is left out instead.
            skipFailingTests: "true",
        ]
        args = options.collectMany { name, value -> ["--" + name, value] }
    }

    // PIT prints its progress, its per-mutator statistics, and warnings that do not apply here (it
    // reports JUnit 5 as missing because the tests use JUnit 5 assertions under the JUnit 4 runner).
    // All of it goes to pit.log; the console gets the survivors report, or the end of the log on failure.
    def pitLog = reportDir.map { it.file("pit.log") }
    ignoreExitValue = true
    def pitLogStream = null
    doFirst {
        // PIT writes no report when no mutant is left on the changed lines, so the directory is
        // emptied first: a report found after the run is this run's.
        def dir = reportDir.get().asFile
        dir.deleteDir()
        dir.mkdirs()
        def log = pitLog.get().asFile
        pitLogStream = new FileOutputStream(log)
        standardOutput = pitLogStream
        errorOutput = pitLogStream
    }

    def maxFiles = providers.gradleProperty("pitestMaxFiles").map {
        Integer.parseInt(it)
    }.orElse(10)
    def maxLinesPerFile = providers.gradleProperty("pitestMaxLinesPerFile").map {
        Integer.parseInt(it)
    }.orElse(10)
    def maxLines = providers.gradleProperty("pitestMaxLines").map {
        Integer.parseInt(it)
    }.orElse(50)
    def showAll = providers.gradleProperty("pitestShowAll")
            .map { it.isEmpty() || Boolean.parseBoolean(it) }
            .orElse(false)
    def testsDescription = providers.gradleProperty("pitestTargetTests").map {
        "tests matching " + it
    }.orElse("all tests")

    doLast {
        pitLogStream?.close()
        def log = pitLog.get().asFile
        def relativeLog = rootDir.toPath().relativize(log.toPath()).toString()
        def exitValue = executionResult.get().exitValue
        if (exitValue != 0) {
            def tail = log.readLines().takeRight(30).join("\n")
            throw new GradleException("PIT failed with exit code ${exitValue}. The end of ${relativeLog}:\n${tail}")
        }
        def changedHeader = com.uber.nullaway.gradle.ChangedLinesFile.readHeader(changedLinesFile.get().asFile.toPath())
        def scope = (changedHeader ?: "against an unknown base") + ", " + testsDescription.get()
        def dir = reportDir.get().asFile
        def report = com.uber.nullaway.gradle.PitestSurvivors.read(
                scope, new File(dir, "mutations.xml"), new File(dir, "linecoverage.xml"), rootDir, mainSourceDirs as List)
        logger.quiet(report.writeAndRender(
                        rootDir, new File(dir, "survivors.txt"),
                        maxFiles.get(), maxLinesPerFile.get(), maxLines.get(), showAll.get(),
                        [
                            rootDir.toPath().relativize(new File(dir, "index.html").toPath()).toString(),
                            relativeLog
                        ]))
    }
}

// The automatic report is a local affordance, so it is wired only where nobody asked for a
// particular JaCoCo setting and the build is not on CI.  A CI checkout fetches the pull request ref
// alone, so there the task would find no base ref and say so once per module on every build.
// `./gradlew :<module>:diffCoverage` still runs it on demand.
if (!enableJacoco.isPresent() && diffCoverageEnabled.get()) {
    tasks.named("jacocoTestReport") {
        finalizedBy(diffCoverage)
    }
}

configurations {
    // A configuration holding the jars for the Error Prone version to use when testing with JDK 17
    errorProneJdk17
}

dependencies {
    errorProneJdk17 "com.google.errorprone:error_prone_check_api:${errorProneJdk17Version}"
    errorProneJdk17 "com.google.errorprone:error_prone_core:${errorProneJdk17Version}"
    errorProneJdk17("com.google.errorprone:error_prone_test_helpers:${errorProneJdk17Version}") {
        exclude group: "junit", module: "junit"
    }
}

// to expose necessary JDK types on JDK 16+; see https://errorprone.info/docs/installation#java-9-and-newer
def commonJavacOpens = [
    "--add-exports=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED",
    "--add-exports=jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED",
    "--add-exports=jdk.compiler/com.sun.tools.javac.main=ALL-UNNAMED",
    "--add-exports=jdk.compiler/com.sun.tools.javac.model=ALL-UNNAMED",
    "--add-exports=jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED",
    "--add-exports=jdk.compiler/com.sun.tools.javac.processing=ALL-UNNAMED",
    "--add-exports=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED",
    "--add-exports=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED",
    "--add-opens=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED",
    "--add-opens=jdk.compiler/com.sun.tools.javac.comp=ALL-UNNAMED",
    "--add-opens=jdk.compiler/com.sun.tools.javac.jvm=ALL-UNNAMED",
]

test {
    maxHeapSize = "1024m"
    jvmArgs += commonJavacOpens
}

// Tasks for testing on other JDK versions; see https://jakewharton.com/build-on-latest-java-test-through-lowest-java/
[21, 27, 28].each { majorVersion ->
    def jdkTest = tasks.register("testJdk$majorVersion", Test) {
        javaLauncher = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(majorVersion)
        }

        description = "Runs the test suite on JDK $majorVersion"
        group = LifecycleBasePlugin.VERIFICATION_GROUP

        // Copy inputs from normal Test task.
        def testTask = tasks.getByName("test")
        classpath = testTask.classpath
        testClassesDirs = testTask.testClassesDirs
        maxHeapSize = "1024m"
        jvmArgs += commonJavacOpens
    }

    tasks.named('check').configure {
        dependsOn jdkTest
    }
}

// Create a task to test with JDK 17 and the supported version of Error Prone for that JDK
def epJdk17Test = tasks.register("testJdk17", Test) {
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(17)
    }

    description = "Runs the test suite on JDK 17"
    group = LifecycleBasePlugin.VERIFICATION_GROUP

    // Copy inputs from normal Test task.
    def testTask = tasks.getByName("test")
    // A bit of a hack: we add the dependencies of the JDK17-supporting Error Prone version to the _beginning_ of the
    // classpath, so that they are used instead of the latest version.  This exercises the scenario of building
    // NullAway against the latest supported Error Prone version but then running on JDK 17.
    classpath = configurations.errorProneJdk17 + testTask.classpath

    testClassesDirs = testTask.testClassesDirs

    jvmArgs += commonJavacOpens
}

tasks.named('check').configure {
    dependsOn(epJdk17Test)
}

// The built-in jacoco-report-aggregation plugin aggregates coverage per test suite,
// matching the variant whose org.gradle.testsuite.name == "test". That auto-created
// variant (coverageDataElementsForTest) only carries the default `test` task's exec
// data. testJdk17/21/27/28 are plain Test tasks that re-run the `test` source set
// under other JDKs, so without this their coverage is dropped from aggregation.
// This attaches their exec files to the `test` suite's coverage variant and
// replaces the old hand-rolled `coverageDataElements` configuration
// See https://github.com/uber/NullAway/pull/1598#issuecomment-4693680548
configurations.named('coverageDataElementsForTest') {
    tasks.withType(Test).matching { it.name != 'test' }.each { testTask ->
        // tasks.named(...).map { } keeps the exec-file reference lazy and carries the
        // task dependency, so requesting the coverage data runs the JDK-specific tests.
        outgoing.artifact(
        tasks.named(testTask.name).map { t ->
            t.extensions.getByType(JacocoTaskExtension).destinationFile
        })
    }
}
