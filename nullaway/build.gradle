import net.ltgt.gradle.errorprone.CheckSeverity

plugins {
    id 'java-library'
    id 'nullaway.java-test-conventions'
}

def libraryModelGeneratorSources =
        project(":library-model:library-model-generator").file("src/shared/java")

sourceSets {
    main {
        java.srcDir libraryModelGeneratorSources
    }
}

spotless {
    java {
        // These files are formatted by the library-model-generator project's Spotless tasks.
        targetExclude fileTree(libraryModelGeneratorSources)
    }
}

configurations {
    // A configuration holding the jars for the oldest supported version of Error Prone, to use with tests
    errorProneOldest

    // A configuration holding the jars for the latest snapshot version of Error Prone, to use with tests
    errorProneLatestSnapshot {
        resolutionStrategy.cacheChangingModulesFor 0, 'seconds'
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == "com.google.errorprone") {
                details.useVersion "1.0-HEAD-SNAPSHOT"
            }
        }
    }

    // To resolve the errorprone dependencies for the buildWithNullAway task
    errorproneExtended {
        extendsFrom errorprone
        canBeResolved = true
    }
}

dependencies {
    compileOnly project(":annotations")
    compileOnly libs.auto.service.annotations
    annotationProcessor libs.auto.service
    // Using api following the guidance at https://jspecify.dev/docs/using#gradle
    api libs.jspecify
    compileOnly libs.jetbrains.annotations
    compileOnly libs.javax.inject


    compileOnly libs.error.prone.check.api
    implementation libs.checker.dataflow
    implementation libs.guava

    testImplementation project(":annotations")
    testImplementation libs.junit4
    testImplementation libs.error.prone.core
    testImplementation(libs.error.prone.test.helpers) {
        exclude group: "junit", module: "junit"
    }
    testImplementation libs.jetbrains.annotations
    testImplementation libs.bundles.junit.jupiter
    testImplementation libs.checker.qual
    testImplementation libs.checker.compat.qual
    testImplementation libs.jspecify
    testImplementation libs.jackson.databind
    testImplementation project(":test-java-lib")
    testImplementation libs.jakarta.inject
    testImplementation libs.javax.inject
    testImplementation libs.rxjava2
    testImplementation libs.reactor.core
    testImplementation libs.commons.lang
    testImplementation libs.commons.lang3
    testImplementation libs.commons.collections
    testImplementation libs.commons.collections4
    testImplementation project(":test-library-models")
    testImplementation libs.lombok
    testImplementation libs.spring.beans
    testImplementation libs.spring.context
    testImplementation libs.spring.webflux
    testImplementation libs.grpc.core
    testImplementation project(":test-java-lib-lombok")
    testImplementation libs.mockito
    testImplementation libs.javax.annotation
    testImplementation libs.assertj
    testImplementation libs.amazon.utils
    testImplementation libs.jakarta.annotations
    errorProneOldest "com.google.errorprone:error_prone_check_api:${oldestErrorProneVersion}"
    errorProneOldest "com.google.errorprone:error_prone_core:${oldestErrorProneVersion}"
    errorProneOldest("com.google.errorprone:error_prone_test_helpers:${oldestErrorProneVersion}") {
        exclude group: "junit", module: "junit"
    }
    errorProneOldest libs.guava

    errorProneLatestSnapshot "com.google.errorprone:error_prone_check_api:1.0-HEAD-SNAPSHOT"
    errorProneLatestSnapshot "com.google.errorprone:error_prone_core:1.0-HEAD-SNAPSHOT"
    errorProneLatestSnapshot("com.google.errorprone:error_prone_test_helpers:1.0-HEAD-SNAPSHOT") {
        exclude group: "junit", module: "junit"
    }

    // without this, some other version of the JetBrains annotations gets pulled in via transitive dependencies
    errorProneJdk17 libs.jetbrains.annotations
    errorProneOldest libs.jetbrains.annotations
}

repositories {
    // This repository is scoped so we can only pull in Error Prone snapshots from it.
    maven {
        name = "SonatypeErrorProneSnapshots"
        url = uri("https://central.sonatype.com/repository/maven-snapshots/")
        mavenContent {
            snapshotsOnly()
        }
        content {
            includeGroup("com.google.errorprone")
        }
    }
}

apply plugin: 'com.vanniktech.maven.publish'

// These --add-exports arguments are required when targeting JDK 11+ since Error Prone and NullAway access a bunch of
// JDK-internal APIs that are not exposed otherwise.
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += [
        "--add-exports=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED",
        "--add-exports=jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED",
        "--add-exports=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED",
        "--add-exports=jdk.compiler/com.sun.tools.javac.comp=ALL-UNNAMED",
        "--add-exports=jdk.compiler/com.sun.tools.javac.main=ALL-UNNAMED",
        "--add-exports=jdk.compiler/com.sun.tools.javac.model=ALL-UNNAMED",
        "--add-exports=jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED",
        "--add-exports=jdk.compiler/com.sun.tools.javac.processing=ALL-UNNAMED",
        "--add-exports=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED",
        "--add-exports=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED",
        "--add-exports=jdk.compiler/com.sun.source.tree=ALL-UNNAMED",
    ]
}

// Create a task to test with the oldest supported version of Error Prone
// (while still building against the latest supported version)
def epOldestTest = tasks.register("testErrorProneOldest", Test) {
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(17)
    }

    description = "Runs the test suite using the oldest supported version of Error Prone"
    group = LifecycleBasePlugin.VERIFICATION_GROUP

    // Copy inputs from normal Test task.
    def testTask = tasks.getByName("test")
    // A bit of a hack: we add the dependencies of the oldest supported Error Prone version to the _beginning_ of the
    // classpath, so that they are used instead of the latest version.  This exercises the scenario of building
    // NullAway against the latest supported Error Prone version but then running on the oldest supported version.
    classpath = configurations.errorProneOldest + testTask.classpath

    testClassesDirs = testTask.testClassesDirs

    jvmArgs += [
        "--add-exports=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED",
        "--add-exports=jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED",
        "--add-exports=jdk.compiler/com.sun.tools.javac.main=ALL-UNNAMED",
        "--add-exports=jdk.compiler/com.sun.tools.javac.model=ALL-UNNAMED",
        "--add-exports=jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED",
        "--add-exports=jdk.compiler/com.sun.tools.javac.processing=ALL-UNNAMED",
        "--add-exports=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED",
        "--add-exports=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED",
        "--add-opens=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED",
        "--add-opens=jdk.compiler/com.sun.tools.javac.comp=ALL-UNNAMED",
        // Accessed by Lombok tests
        "--add-opens=jdk.compiler/com.sun.tools.javac.jvm=ALL-UNNAMED",
    ]
}

// Create a task to test with the latest snapshot version of Error Prone
// (while still building against the latest supported version)
tasks.register("testErrorProneLatestSnapshot", Test) {
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(25)
    }

    description = "Runs the test suite using the latest snapshot version of Error Prone"
    group = LifecycleBasePlugin.VERIFICATION_GROUP

    // Copy inputs from normal Test task.
    def testTask = tasks.getByName("test")
    // We add the dependencies of the latest snapshot Error Prone version to the _beginning_ of the
    // classpath, so that they are used instead of the latest supported version.
    classpath = configurations.errorProneLatestSnapshot + testTask.classpath

    testClassesDirs = testTask.testClassesDirs

    jvmArgs += [
        "--add-exports=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED",
        "--add-exports=jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED",
        "--add-exports=jdk.compiler/com.sun.tools.javac.main=ALL-UNNAMED",
        "--add-exports=jdk.compiler/com.sun.tools.javac.model=ALL-UNNAMED",
        "--add-exports=jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED",
        "--add-exports=jdk.compiler/com.sun.tools.javac.processing=ALL-UNNAMED",
        "--add-exports=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED",
        "--add-exports=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED",
        "--add-opens=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED",
        "--add-opens=jdk.compiler/com.sun.tools.javac.comp=ALL-UNNAMED",
        // Accessed by Lombok tests
        "--add-opens=jdk.compiler/com.sun.tools.javac.jvm=ALL-UNNAMED",
    ]
}

tasks.named('check').configure {
    dependsOn(epOldestTest)
}

[
    'test',
    'testJdk21',
    'testErrorProneLatestSnapshot'
].each { taskName ->
    tasks.named(taskName).configure {
        filter {
            // On Error Prone 2.46.0 and above, this test will not pass, since CompilationTestHelper passes the
            // -XDaddTypeAnnotationsToSymbol flag by default.  The test is still run on JDK 17.
            excludeTestsMatching "com.uber.nullaway.ErrorProneCLIFlagsConfigTest.missingTypeAnnotationSymbolFlagForJSpecifyModeOnOlderJDK"
        }
    }
}

// Create a task to build NullAway with NullAway checking enabled
tasks.register('buildWithNullAway', JavaCompile) {
    // Configure compilation to run with Error Prone, NullAway, and the JSpecify
    // annotation-location check
    source = sourceSets.main.java
    classpath = sourceSets.main.compileClasspath
    destinationDirectory.set(layout.buildDirectory.dir('ignoredClasses'))
    options.annotationProcessorPath = files(
            configurations.errorproneExtended.asCollection(),
            sourceSets.main.annotationProcessorPath,
            // This refers to the NullAway jar built from the current source
            jar.archiveFile.get(),
            sourceSets.main.compileClasspath)
    options.errorprone.enabled = true
    options.errorprone {
        disableAllChecks = true
        error("NullAway")
        error("JSpecifyUnrecognizedAnnotationLocation")
        option("NullAway:AnnotatedPackages", "com.uber,org.checkerframework.nullaway,com.google.common")
        option("NullAway:CastToNonNullMethod", "com.uber.nullaway.NullabilityUtil.castToNonNull")
        option("NullAway:CheckOptionalEmptiness")
        option("NullAway:CheckContracts")
        option("NullAway:JSpecifyMode")
        option("NullAway:JSpecifyExperimental")
    }
    // Make sure the jar has already been built
    dependsOn 'jar'
    // Check that the NullAway jar actually exists (without this,
    // Gradle will run the compilation even if the jar doesn't exist)
    doFirst {
        assert jar.archiveFile.get().getAsFile().exists()
    }
}

project.tasks.named('check').configure {
    dependsOn 'buildWithNullAway'
}

// The crash, metamorphic, and growth oracles: a harness that runs NullAway over sources taken from its own tests and over
// variants of them (see com.uber.nullaway.oracles.OracleRunner).  The harness and its unit tests live in source sets
// of their own, so that `test`, diffCoverage, and pitestDiff never see them.  The harness compiles seeds against the
// classpath it runs with, which therefore holds every jar the NullAway tests reference.
sourceSets {
    oracles {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    oraclesTest {
        compileClasspath += sourceSets.main.output + sourceSets.oracles.output
        runtimeClasspath += sourceSets.main.output + sourceSets.oracles.output
    }
}

configurations {
    oraclesImplementation.extendsFrom testImplementation
    oraclesRuntimeOnly.extendsFrom testRuntimeOnly
    oraclesTestImplementation.extendsFrom oraclesImplementation
    oraclesTestRuntimeOnly.extendsFrom oraclesRuntimeOnly
}

def oraclesJvmArgs = [
    "--add-exports=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED",
    "--add-exports=jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED",
    "--add-exports=jdk.compiler/com.sun.tools.javac.main=ALL-UNNAMED",
    "--add-exports=jdk.compiler/com.sun.tools.javac.model=ALL-UNNAMED",
    "--add-exports=jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED",
    "--add-exports=jdk.compiler/com.sun.tools.javac.processing=ALL-UNNAMED",
    "--add-exports=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED",
    "--add-exports=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED",
    "--add-opens=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED",
    "--add-opens=jdk.compiler/com.sun.tools.javac.comp=ALL-UNNAMED",
    "--add-opens=jdk.compiler/com.sun.tools.javac.jvm=ALL-UNNAMED",
]

// The harness's unit tests take seconds, so `check` runs them and a change to NullAway that breaks the harness fails
// the pull request that makes it rather than the next oracle run on master.
def oraclesTest = tasks.register('oraclesTest', Test) {
    description = "Runs the unit tests of the oracle harness"
    group = LifecycleBasePlugin.VERIFICATION_GROUP
    testClassesDirs = sourceSets.oraclesTest.output.classesDirs
    classpath = sourceSets.oraclesTest.runtimeClasspath
    maxHeapSize = "1024m"
    jvmArgs += oraclesJvmArgs
}

tasks.named('check').configure {
    dependsOn oraclesTest
}

// Runs the oracles and writes the report under build/oracles.  Pass arguments with --args, for example
// ./gradlew :nullaway:runOracles --args="--limit 200 --configs jspecify"
// The task fails when the run finds a crash signature that src/oracles/known-findings.tsv does not list.
// The javac of the JDK it runs on decides which sources are valid, and the known findings were recorded on JDK 21;
// -PoraclesJdk=<version> picks another one.
tasks.register('runOracles', JavaExec) {
    description = "Runs NullAway's crash, metamorphic, and growth oracles over seeds taken from its tests"
    group = LifecycleBasePlugin.VERIFICATION_GROUP
    def oraclesJdk = providers.gradleProperty("oraclesJdk").getOrElse("21") as int
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(oraclesJdk)
    }
    classpath = sourceSets.oracles.runtimeClasspath
    mainClass = 'com.uber.nullaway.oracles.OracleRunner'
    workingDir = projectDir
    maxHeapSize = "2g"
    jvmArgs += oraclesJvmArgs
    // Without it, a NullPointerException thrown often enough loses its stack trace, and the crash its signature.
    jvmArgs += "-XX:-OmitStackTraceInFastThrow"
}
